<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>赞赏支持 - 资源小站</title>


    <style>

        /* ==================== 本地字体声明 ==================== */
        @font-face {
            font-family: 'MySiteFont';
            src: url('./res/fonts/myfont.ttf') format('truetype');
        }


        /* ==================== CSS 变量 & 全局样式（与主站相同） ==================== */
        :root {
            --font-primary: 'MySiteFont', sans-serif;
            --font-display: 'MySiteFont', sans-serif;

            --color-bg-overlay: rgba(0, 0, 0, 0.35);
            --color-card-bg: rgba(255, 255, 255, 0.88);
            --color-card-bg-hover: rgba(255, 255, 255, 0.96);
            --color-card-shadow: rgba(0, 0, 0, 0.08);
            --color-card-shadow-hover: rgba(0, 0, 0, 0.18);
            --color-text-primary: #1a1a2e;
            --color-text-secondary: #4a4a5e;
            --color-text-muted: #6b6b80;
            --color-accent: #ff6b6b;
            --color-accent-hover: #e55a5a;
            --color-accent-2: #ffa94d;
            --color-border: rgba(0, 0, 0, 0.06);
            --color-modal-overlay: rgba(0, 0, 0, 0.65);

            --radius-sm: 10px;
            --radius-md: 16px;
            --radius-lg: 22px;
            --radius-xl: 28px;

            --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.06);
            --shadow-md: 0 6px 20px rgba(0, 0, 0, 0.10);
            --shadow-lg: 0 14px 40px rgba(0, 0, 0, 0.14);
            --shadow-xl: 0 24px 56px rgba(0, 0, 0, 0.20);

            --transition-fast: 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            --transition-smooth: 0.35s cubic-bezier(0.4, 0, 0.2, 1);
            --transition-bounce: 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);

            --max-width: 700px;
            --header-padding: 40px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
            font-size: 16px;
        }

        body {
            font-family: var(--font-primary);
            min-height: 100vh;
            color: var(--color-text-primary);
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;

            /* ▼ 背景图片（与主站相同） ▼ */
            background-image:
                linear-gradient(135deg,
                    rgba(30, 30, 60, 0.55) 0%,
                    rgba(20, 20, 45, 0.45) 30%,
                    rgba(40, 30, 55, 0.50) 60%,
                    rgba(25, 25, 50, 0.55) 100%),
                    url('./res/pic/bg.jpg');
            /* ▲ 可替换背景图片URL ▲ */

            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        /* 背景纹理叠加 */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 0;
            background:
                radial-gradient(ellipse at 20% 20%, rgba(255, 255, 255, 0.04) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 60%, rgba(255, 255, 255, 0.03) 0%, transparent 50%),
                radial-gradient(ellipse at 50% 80%, rgba(200, 180, 255, 0.05) 0%, transparent 50%);
            opacity: 0.7;
        }

        /* 主容器 */
        .main-container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: var(--max-width);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 24px;
            animation: fadeInUp 0.7s ease-out;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(24px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ==================== 标题区域 ==================== */
        .page-title {
            font-family: var(--font-display);
            font-size: clamp(2rem, 5vw, 2.8rem);
            font-weight: 800;
            color: #ffffff;
            text-align: center;
            letter-spacing: 0.03em;
            text-shadow: 0 4px 20px rgba(0, 0, 0, 0.35), 0 2px 6px rgba(0, 0, 0, 0.25);
            line-height: 1.25;
        }

        .page-title .highlight {
            background: linear-gradient(135deg, #ff9a56, #ff6b6b, #ee5a6f);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 3px 8px rgba(255, 107, 107, 0.4));
            display: inline;
        }

        .page-subtitle {
            font-family: var(--font-primary);
            font-size: clamp(0.95rem, 1.8vw, 1.15rem);
            font-weight: 400;
            color: rgba(255, 255, 255, 0.85);
            text-align: center;
            letter-spacing: 0.05em;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
            margin-top: -12px;
        }

        /* ==================== 二维码卡片 ==================== */
        .qrcode-card {
            width: 100%;
            background: var(--color-card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: var(--radius-xl);
            padding: 32px 28px;
            box-shadow: var(--shadow-lg);
            border: 1px solid var(--color-border);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            transition: all var(--transition-smooth);
        }

        .qrcode-card:hover {
            box-shadow: var(--shadow-xl);
            transform: translateY(-3px);
            background: var(--color-card-bg-hover);
            border-color: rgba(0, 0, 0, 0.12);
        }

        .qrcode-image-wrapper {
            position: relative;
            width: 100%;
            max-width: 320px;
            aspect-ratio: 1 / 1;
            background: #ffffff;
            border-radius: var(--radius-md);
            overflow: hidden;
            box-shadow: var(--shadow-md);
            border: 2px solid rgba(0, 0, 0, 0.05);
            transition: all var(--transition-smooth);
        }

        .qrcode-image-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
            padding: 12px;
            background: #fff;
        }

        /* 二维码图片加载失败时的占位 */
        .qrcode-placeholder {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f8f8f8;
            color: #aaa;
            font-size: 0.9rem;
            text-align: center;
            padding: 16px;
        }

        .qrcode-tip {
            font-size: 0.95rem;
            color: var(--color-text-secondary);
            text-align: center;
            line-height: 1.7;
            font-weight: 500;
        }

        .qrcode-tip .emoji {
            font-size: 1.2em;
            margin: 0 3px;
        }

        /* 返回按钮 */
        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 12px 28px;
            font-family: var(--font-primary);
            font-size: 1rem;
            font-weight: 600;
            color: #fff;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: 50px;
            text-decoration: none;
            cursor: pointer;
            transition: all var(--transition-bounce);
            box-shadow: var(--shadow-sm);
            letter-spacing: 0.03em;
        }

        .back-btn:hover {
            background: rgba(255, 255, 255, 0.25);
            border-color: rgba(255, 255, 255, 0.45);
            transform: translateY(-2px);
            box-shadow: var(--shadow-md);
            color: #fff;
        }

        .back-btn:active {
            transform: translateY(0);
            transition: all 0.1s ease;
        }

        .back-btn svg {
            width: 18px;
            height: 18px;
            fill: currentColor;
        }

        /* 页脚 */
        .footer-text {
            text-align: center;
            font-size: 0.82rem;
            color: rgba(255, 255, 255, 0.55);
            letter-spacing: 0.04em;
            margin-top: 4px;
        }

        /* ==================== 响应式设计 ==================== */
        @media (max-width: 768px) {
            body {
                background-attachment: scroll;
                padding: 14px;
            }

            .main-container {
                gap: 18px;
            }

            .qrcode-card {
                padding: 22px 18px;
                border-radius: var(--radius-lg);
                gap: 16px;
            }

            .qrcode-image-wrapper {
                max-width: 260px;
            }
        }

        @media (max-width: 480px) {
            .main-container {
                gap: 14px;
            }

            .qrcode-card {
                padding: 18px 14px;
                border-radius: var(--radius-md);
            }

            .qrcode-image-wrapper {
                max-width: 220px;
            }

            .page-title {
                font-size: 1.7rem;
            }

            .qrcode-tip {
                font-size: 0.85rem;
            }
        }
    </style>
</head>
<body>

    <!-- ==================== 主容器 ==================== -->
    <div class="main-container">

        <!-- 大标题 -->
        <h1 class="page-title">
            <span class="highlight">赞赏</span>支持
        </h1>

        <!-- 小标题 -->
        <p class="page-subtitle">感谢您的认可与鼓励 💖</p>

        <!-- 二维码卡片 -->
        <div class="qrcode-card">
            <!-- ▼ 在这里修改赞赏二维码图片URL ▼ -->
            <div class="qrcode-image-wrapper">
                <img id="qrcodeImage"
                     src="./res/pic/donate.jpg"
                     alt="赞赏二维码"
                     loading="lazy"
                     onerror="this.style.display='none'; this.parentNode.querySelector('.qrcode-placeholder').style.display='flex';">
                <div class="qrcode-placeholder" style="display: none;">
                    📱<br>二维码加载失败<br>请稍后重试
                </div>
            </div>
            <!-- ▲ 可替换为你的收款码图片 ▲ -->
            <!-- 示例：使用本地图片 <img src="./images/donate-qr.png" alt="赞赏二维码"> -->

            <p class="qrcode-tip">
                <span class="emoji">📱</span> 保存图片到相册<br>
                <span class="emoji">📲</span> 打开微信扫一扫<br>
                <span class="emoji">💝</span> 你的支持是我创作的动力！
            </p>
        </div>

        <!-- 返回按钮 -->
        <!-- ▼ 修改返回链接为你的主站地址 ▼ -->
        <a href="./index.html" class="back-btn" title="返回上一页">
            <svg viewBox="0 0 24 24">
                <path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/>
            </svg>
            返回资源小站
        </a>
        <!-- ▲ 可替换链接地址 ▲ -->

        <!-- 页脚 -->
        <p class="footer-text">每一份赞赏都是坚持的动力 🌟</p>
    </div>

</body>
</html>
